# Redis configuration for DocSaarthi development
bind 0.0.0.0
port 6379
protected-mode no

# Persistence
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Memory
maxmemory 512mb
maxmemory-policy allkeys-lru

# General
loglevel notice
databases 16
timeout 0
tcp-keepalive 300
